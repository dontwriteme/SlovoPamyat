name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, work]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK components
        run: |
          # GitHub Ubuntu runners already include Android cmdline tools.
          # The previous setup action requested the obsolete "tools" package.
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDK_MANAGER" ]; then
            echo "Android SDK command-line tools not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify approved corpus and regenerate search index
        run: ./gradlew --no-daemon :app:verifySynodalSearchIndex --stacktrace
      - name: Run Android Lint
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace
      - name: Run complete Android regression suite
        run: ./gradlew --no-daemon -I tests/validation.init.gradle :app:testDebugUnitTest --stacktrace
      - name: Build installable debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svetoch-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: svetoch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
