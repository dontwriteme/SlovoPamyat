name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, work]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK components
        run: |
          # GitHub Ubuntu runners already include Android cmdline tools.
          # The previous setup action requested the obsolete "tools" package.
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDK_MANAGER" ]; then
            echo "Android SDK command-line tools not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up verified Gradle 8.9 (do not execute the repo wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # Repository's historical wrapper JAR is not canonical. The job runs
          # the downloaded official Gradle binary, never ./gradlew.
          validate-wrappers: false
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Test complete backup and safe restore
        run: gradle --no-daemon -I tests/validation.init.gradle :app:testDebugUnitTest --tests org.biblememory.app.SvetochBackupTest --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: svetoch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
