plugins { id 'com.android.application' }

android {
    namespace 'org.biblememory.app'
    compileSdk 35
    defaultConfig {
        applicationId 'org.biblememory.app'
        minSdk 26
        targetSdk 34
        versionCode 28
        versionName '0.21.6'

    }
    // Search index must be stored uncompressed for direct memory mapping.
    androidResources {
        noCompress += ['sidx']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Normal builds never fetch or replace Bible data. The tracked assets are the
// approved offline corpus and its corresponding search index.
def bibleAsset = file('src/main/assets/synodal.json')
def indexAsset = file('src/main/assets/synodal.sidx')
def corpusSha256 = '553df7df63cff838fabac65b480aaf1a07ad59d536c14c140c93e1b29d801bb4'
// The Git blob identifier includes the canonical "blob <size>\0" header.
def indexGitBlob = '806cc16621f67ae506063b38123bf48c7b611a96'

def digestFile = { File asset, String algorithm, boolean gitBlob ->
    def digest = java.security.MessageDigest.getInstance(algorithm)
    if (gitBlob) {
        digest.update(("blob " + asset.length() + "\u0000").getBytes(java.nio.charset.StandardCharsets.UTF_8))
    }
    asset.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().encodeHex().toString()
}

def requireAsset = { File asset, String expected, String algorithm, boolean gitBlob ->
    if (!asset.isFile()) {
        throw new GradleException("Missing approved Bible asset: ${asset.name}. Restore it from the checked-in revision; see docs/BUILD.md.")
    }
    String actual = digestFile(asset, algorithm, gitBlob)
    if (actual != expected) {
        throw new GradleException("Unexpected Bible asset: ${asset.name}; expected ${expected}, got ${actual}. Restore it from Git or follow the reviewed update procedure in docs/BUILD.md.")
    }
}

// No outputs: always check the assets, including when other tasks are up-to-date.
tasks.register('prepareSynodal') {
    doLast {
        requireAsset(bibleAsset, corpusSha256, 'SHA-256', false)
    }
}
tasks.register('verifyBundledSynodal') {
    dependsOn tasks.named('prepareSynodal')
    doLast {
        requireAsset(indexAsset, indexGitBlob, 'SHA-1', true)
    }
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyBundledSynodal')
}

apply from: 'search-index.gradle'
