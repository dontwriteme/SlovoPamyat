// Isolated real-SQLite guards; no production dependency changes.
allprojects {
    afterEvaluate { p ->
        if(p.path==':app') {
            p.android.defaultConfig.testInstrumentationRunner='org.biblememory.app.StorageSafetyCheck'
            p.android.sourceSets.androidTest.java.srcDirs=[rootProject.file('tests/device')]
        }
    }
}
